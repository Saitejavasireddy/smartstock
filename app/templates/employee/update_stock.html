{% extends 'base.html' %}

{% block content %}

<div class="page-header" data-aos="fade-down">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="bi bi-arrow-left-right"></i> Update Stock</h2>
            <p class="mb-0 opacity-75">Record a sale or restock</p>
        </div>
        <a href="{{ url_for('employee.dashboard') }}" class="btn"
           style="background:rgba(255,255,255,0.2);color:white;border-radius:10px;font-weight:600;">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card" data-aos="fade-up">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Product</label>
                    <select name="product_id" class="form-select" required>
                        <option value="">Select product</option>
                        {% for p in products %}
                            <option value="{{ p.id }}">
                                {{ p.name }} ({{ p.current_stock }} {{ p.unit }} in stock)
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Transaction Type</label>
                    <select name="type" class="form-select" required>
                        <option value="">Select type</option>
                        <option value="sale">🔴 Sale (Stock Out)</option>
                        <option value="restock">🟢 Restock (Stock In)</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" class="form-control"
                           placeholder="Enter quantity" step="0.1" min="0.1" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Note (optional)</label>
                    <input type="text" name="note" class="form-control"
                           placeholder="e.g. Morning shift sale">
                </div>
            </div>
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-circle"></i> Update Stock
            </button>
        </form>
    </div>
</div>

{% endblock %}
