{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-2">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div style="width:70px;height:70px;background:linear-gradient(135deg,#11998e,#38ef7d);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                        <i class="bi bi-person-badge text-white" style="font-size:2rem;"></i>
                    </div>
                    <h3 class="fw-bold">Employee Login</h3>
                    <p class="text-muted">Sign in with your employee credentials</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" 
                               placeholder="Enter your email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" 
                               placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn w-100 mb-3 py-2 text-white fw-bold"
                            style="background:linear-gradient(135deg,#11998e,#38ef7d);border:none;border-radius:10px;">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                    <div class="text-center">
                        <p class="text-muted mb-1">Are you a store owner? 
                            <a href="{{ url_for('auth.login') }}" style="color:#667eea;font-weight:600;">Login here</a>
                        </p>
                        <p class="text-muted">
                            <a href="{{ url_for('auth.landing') }}" style="color:#667eea;">← Back to home</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
