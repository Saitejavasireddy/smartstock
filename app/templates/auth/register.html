{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shop fs-1 text-dark"></i>
                    <h3 class="fw-bold mt-2">Create Your Store</h3>
                    <p class="text-muted">Set up your SmartStock account</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Your Name</label>
                        <input type="text" name="name" class="form-control" 
                               placeholder="e.g. John Smith" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Store Name</label>
                        <input type="text" name="store_name" class="form-control" 
                               placeholder="e.g. John's Grocery" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" 
                               placeholder="your@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" 
                               placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 mb-3">
                        <i class="bi bi-check-circle"></i> Create Account
                    </button>
                    <p class="text-center text-muted">
                        Already have an account? 
                        <a href="{{ url_for('auth.login') }}">Login here</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
