{% extends 'base.html' %}

{% block content %}

<div class="page-header" data-aos="fade-down">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="bi bi-pencil"></i> Edit Product</h2>
            <p class="mb-0 opacity-75">Update product details and threshold</p>
        </div>
        <a href="{{ url_for('admin.products') }}" class="btn"
           style="background:rgba(255,255,255,0.2);color:white;border-radius:10px;font-weight:600;">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card" data-aos="fade-up">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ product.name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control"
                           value="{{ product.category }}" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Unit</label>
                    <select name="unit" class="form-select" required>
                        <option value="pieces" {% if product.unit == 'pieces' %}selected{% endif %}>Pieces</option>
                        <option value="kg" {% if product.unit == 'kg' %}selected{% endif %}>Kg</option>
                        <option value="litres" {% if product.unit == 'litres' %}selected{% endif %}>Litres</option>
                        <option value="boxes" {% if product.unit == 'boxes' %}selected{% endif %}>Boxes</option>
                        <option value="packets" {% if product.unit == 'packets' %}selected{% endif %}>Packets</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Current Stock</label>
                    <input type="number" name="current_stock" class="form-control"
                           value="{{ product.current_stock }}" step="0.1" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Reorder Threshold</label>
                    <input type="number" name="threshold" class="form-control"
                           value="{{ product.threshold }}" step="0.1" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-circle"></i> Save Changes
            </button>
        </form>
    </div>
</div>

{% endblock %}
