{% extends 'base.html' %}

{% block content %}

<div class="page-header" data-aos="fade-down">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="bi bi-plus-circle"></i> Add Product</h2>
            <p class="mb-0 opacity-75">Add a new product to your inventory</p>
        </div>
        <a href="{{ url_for('admin.products') }}" class="btn"
           style="background:rgba(255,255,255,0.2);color:white;border-radius:10px;font-weight:600;">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card" data-aos="fade-up">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control"
                           placeholder="e.g. Coca Cola 500ml" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control"
                           placeholder="e.g. Beverages" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Unit</label>
                    <select name="unit" class="form-select" required>
                        <option value="">Select unit</option>
                        <option value="pieces">Pieces</option>
                        <option value="kg">Kg</option>
                        <option value="litres">Litres</option>
                        <option value="boxes">Boxes</option>
                        <option value="packets">Packets</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Current Stock</label>
                    <input type="number" name="current_stock" class="form-control"
                           placeholder="e.g. 100" step="0.1" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Reorder Threshold</label>
                    <input type="number" name="threshold" class="form-control"
                           placeholder="e.g. 20" step="0.1" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-circle"></i> Add Product
            </button>
        </form>
    </div>
</div>

{% endblock %}
